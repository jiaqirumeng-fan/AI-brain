<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海马体 · 记忆网络</title>
  <meta name="description" content="会遗忘、会联想的第二大脑：记忆节点、突触与跨域洞察。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237aa2ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%239df5d5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
          <defs>
            <radialGradient id="core" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#cfe0ff"/>
              <stop offset="55%" stop-color="#7aa2ff"/>
              <stop offset="100%" stop-color="#6a5cff"/>
            </radialGradient>
          </defs>
          <circle cx="17" cy="17" r="3.4" fill="url(#core)"/>
          <circle cx="17" cy="17" r="8.2" stroke="rgba(140,175,255,.55)" stroke-width="1"/>
          <circle cx="17" cy="17" r="13.6" stroke="rgba(140,175,255,.18)" stroke-width="1" stroke-dasharray="2 4.5"/>
          <path d="M17 8.8V4.4M25.2 12.8l3.9-2.2M25.2 21.2l3.9 2.2M8.8 21.2 4.9 23.4M8.8 12.8 4.9 10.6"
                stroke="rgba(150,190,255,.5)" stroke-width="1" stroke-linecap="round"/>
          <circle cx="17" cy="4.4" r="1.3" fill="#9df5d5"/>
          <circle cx="29.1" cy="10.6" r="1.1" fill="#8f7bff"/>
          <circle cx="29.1" cy="23.4" r="1.1" fill="#4cc9f0"/>
          <circle cx="4.9" cy="23.4" r="1.1" fill="#ffd166"/>
          <circle cx="4.9" cy="10.6" r="1.1" fill="#ff6b9a"/>
        </svg>
        <div class="brand-text">
          <h1>海马体</h1>
          <span>HIPPOCAMPUS · 记忆网络</span>
        </div>
      </div>

      <div class="searchwrap">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" placeholder="搜索记忆、概念、标签…" autocomplete="off" spellcheck="false">
        <span class="search-count" id="searchCount"></span>
        <kbd>/</kbd>
      </div>

      <div class="top-actions">
        <button class="btn primary" id="btnAdd">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          添加记忆
        </button>
        <button class="btn ghost" id="btnScan">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="7" r="2.4" stroke="currentColor" stroke-width="1.5"/><circle cx="17" cy="17" r="2.4" stroke="currentColor" stroke-width="1.5"/><path d="M9.2 8.6c2.2 1.1 3 2.7 5.6 6.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/></svg>
          关联扫描
        </button>
        <button class="btn ghost" id="btnGlobal">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="7" r="1.8" stroke="currentColor" stroke-width="1.4"/><circle cx="19" cy="7" r="1.8" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="17" r="1.8" stroke="currentColor" stroke-width="1.4"/><circle cx="19" cy="17" r="1.8" stroke="currentColor" stroke-width="1.4"/><path d="M10 11 6.6 8.4M14 11l3.4-2.6M10 13l-3.4 2.6M14 13l3.4 2.6" stroke="currentColor" stroke-width="1.3"/></svg>
          全局视角
        </button>
        <button class="btn ghost" id="btnKB">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20M8 7h8M8 10.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          知识库
        </button>
        <button class="btn icon" id="btnPhone" title="手机感官">
          <svg viewBox="0 0 24 24" fill="none" style="width:16px;height:16px"><rect x="7" y="2.5" width="10" height="19" rx="2.4" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 5.2h3M11 18.6h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="btn icon" id="btnHelp" title="使用说明">?</button>
        <div class="menu-wrap">
          <button class="btn icon" id="btnMenu" title="更多">⋯</button>
          <div class="menu hidden" id="menu">
            <button data-act="export"><span>导出记忆库</span><em>.json</em></button>
            <button data-act="import"><span>导入记忆库</span><em>.json</em></button>
            <button data-act="relayout"><span>重新布局</span><em>L</em></button>
            <div class="menu-sep"></div>
            <button data-act="reset" class="danger"><span>重置为示例脑</span></button>
          </div>
        </div>
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
      </div>
    </header>

    <aside class="sidebar">
      <div class="side-scroll">
        <section class="side-sec vitals">
          <div class="sec-head">
            <span class="kicker">VITALS</span>
            <h2>整体状态</h2>
          </div>
          <div class="stat-grid">
            <div class="stat"><b id="statNodes">—</b><span>记忆节点</span></div>
            <div class="stat"><b id="statSyn">—</b><span>突触</span></div>
            <div class="stat"><b id="statBridge">—</b><span>跨域桥</span></div>
            <div class="stat"><b id="statVitality">—</b><span>平均可提取</span></div>
          </div>
          <div class="vital-bar"><i id="vitalBar"></i></div>
          <p class="vital-note" id="vitalNote">正在读取记忆痕迹…</p>
        </section>

        <section class="side-sec lobes">
          <div class="sec-head">
            <span class="kicker">LOBES</span>
            <h2>脑区 · 领域</h2>
            <button class="mini" id="lobeClear">全部</button>
          </div>
          <div class="lobe-list" id="lobeList"></div>
        </section>

        <section class="side-sec due">
          <div class="sec-head">
            <span class="kicker">DUE</span>
            <h2>该复习了</h2>
          </div>
          <div class="due-list" id="dueList"></div>
        </section>

        <section class="side-sec bridges">
          <div class="sec-head">
            <span class="kicker">BRIDGES</span>
            <h2>跨域洞察</h2>
          </div>
          <div class="bridge-list" id="bridgeList"></div>
        </section>
      </div>
      <footer class="side-foot">
        <span class="dot" id="saveDot"></span>
        <span id="saveState">已本地保存</span>
        <span class="sep">·</span>
        <span id="clock">--:--</span>
        <span class="mode" id="modeState">本地模式</span>
      </footer>
    </aside>

    <main class="stage" id="stage">
      <canvas id="brain"></canvas>
      <div class="stage-glow"></div>

      <div class="stage-hint" id="hint">
        <span><b>点击</b>查看记忆</span>
        <span><b>双击</b>回想</span>
        <span><b>Shift + 拖拽</b>连突触</span>
        <span><b>时间机器</b>看遗忘</span>
        <button class="hint-x" id="hintClose" aria-label="关闭提示">×</button>
      </div>

      <div class="zoomer">
        <button id="zoomIn" title="放大">+</button>
        <button id="zoomOut" title="缩小">−</button>
        <button id="zoomFit" title="适应视图">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="timebar" id="timebar">
        <div class="tb-label">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v4.5l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          时间机器
        </div>
        <input id="timeRange" type="range" min="0" max="180" step="1" value="0" aria-label="模拟时间流逝">
        <div class="tb-value" id="timeValue">今天</div>
        <div class="tb-presets">
          <button data-d="30">+30 天</button>
          <button data-d="90">+90 天</button>
          <button data-d="180">+180 天</button>
        </div>
        <button class="tb-reset hidden" id="timeReset">回到今天</button>
      </div>

      <div class="stage-legend" id="legend">
        <span><i class="lg-dot bright"></i>可提取</span>
        <span><i class="lg-dot faint"></i>正在遗忘</span>
        <span><i class="lg-line"></i>突触</span>
        <span><i class="lg-line bridge"></i>跨域桥</span>
      </div>
    </main>

    <aside class="detail" id="detail" aria-hidden="true"></aside>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="tooltip" id="tooltip"></div>

  <script src="src/util.js"></script>
  <script src="src/textsim.js"></script>
  <script src="src/model.js"></script>
  <script src="src/seed.js"></script>
  <script src="src/graph.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
