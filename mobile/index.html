<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>海马体 · 手机感官</title>
  <link rel="stylesheet" href="/m/mobile.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 32 32" fill="none"><rect x="10" y="4" width="12" height="24" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M7 10c-1.8 2-1.8 12 0 14M25 10c1.8 2 1.8 12 0 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="24" r="1.2" fill="currentColor"/></svg>
        </span>
        <div><b>海马体</b><small>手机感官</small></div>
      </div>
      <span id="status" class="status"><i></i>连接中</span>
    </header>

    <p class="intro">拍到的、听到的、想到的，<br>都会变成电脑大脑里的记忆节点。</p>

    <section class="card pair" id="pairCard" hidden>
      <div class="card-head"><h2>配对</h2><span>PAIR</span></div>
      <p class="hint">打开电脑脑图的顶栏「手机」→ 扫码，或把地址里的配对码填进来。</p>
      <div class="pair-row">
        <input id="tokenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="配对码">
        <button id="pairBtn" class="mini">连接</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>眼睛 · 拍照</h2><span>CAMERA</span></div>
      <label class="big-action" for="photoInput">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.4l1.1-1.7A1 1 0 0 1 9.8 4h4.4a1 1 0 0 1 .8.4L16.1 6h1.4A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12.5" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
        <span><b>拍照 / 选照片</b><small>调用手机相机，压缩后送入大脑</small></span>
      </label>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      <div id="photoPreview" class="preview" hidden>
        <img id="photoImg" alt="照片预览">
        <div class="preview-meta"><span id="photoMeta"></span><button id="photoClear" class="link">重选</button></div>
        <textarea id="photoNote" rows="2" placeholder="给这张照片一句话（可选）：白板公式 / 实验现象 / 课堂板书…"></textarea>
        <button id="photoSend" class="send">送入大脑</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>耳朵 · 录音</h2><span>MIC</span></div>
      <div id="recorderBox" hidden>
        <button id="recordBtn" class="big-action record">
          <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span><b>开始录音</b><small>再点一次停止</small></span>
        </button>
        <div id="recordTimer" class="timer" hidden>00:00</div>
        <div id="recordPreview" class="preview" hidden>
          <audio id="audioPlayer" controls></audio>
          <textarea id="audioNote" rows="2" placeholder="这段声音是什么？（可选）课堂讲解 / 讨论 / 环境声…"></textarea>
          <button id="audioSend" class="send">送入大脑</button>
          <button id="audioReset" class="link">重录</button>
        </div>
      </div>
      <label id="audioFallback" class="big-action" for="audioInput" hidden>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><b>选择一段录音</b><small>当前是 HTTP，浏览器不能直接开麦；用系统录音机录好后选文件</small></span>
      </label>
      <input id="audioInput" type="file" accept="audio/*" hidden>
      <div id="fallbackPreview" class="preview" hidden>
        <audio id="fallbackPlayer" controls></audio>
        <textarea id="fallbackNote" rows="2" placeholder="这段声音是什么？（可选）课堂讲解 / 讨论 / 环境声…"></textarea>
        <button id="fallbackSend" class="send">送入大脑</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>手 · 一句话</h2><span>NOTE</span></div>
      <textarea id="noteText" rows="3" placeholder="随手记：刚想到的问题、老师说的重点、待办…"></textarea>
      <button id="noteSend" class="send">送去大脑</button>
    </section>

    <section class="recent">
      <div class="recent-head"><h2>刚送来的</h2><button id="refreshRecent" class="link">刷新</button></div>
      <div id="recentList" class="recent-list"><div class="empty">还没有手机记忆。</div></div>
    </section>

    <footer>同一个 Wi-Fi · 数据只留在你的电脑上</footer>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/m/mobile.js" defer></script>
</body>
</html>
